[project]
name = "visionx-rpi-capture"
version = "0.1.0"
description = "Raspberry Pi image capture and streaming service for VisionX using Flask"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "gevent>=24.2.1",
    "gunicorn>=25.0.3",
    "numpy>=1.26",
    "opencv-contrib-python-headless>=4.13.0.92",
    "pyserial>=3.5",
    "requests>=2.32.3",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
rpi = [
    "picamera2; sys_platform == 'linux'",
]

[dependency-groups]
scripts = [
    "numpy>=1.26",
    "Pillow>=10.0",
]
test-server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "piexif>=1.1.3",
]

# python-prctl is a C extension that only builds on Linux (a transitive dep of picamera2).
# Stub its metadata so uv can resolve the lockfile on non-Linux dev machines without
# attempting to compile it from source.
[[tool.uv.dependency-metadata]]
name = "python-prctl"
version = "1.8.1"
requires-dist = []
